name: Java CI with Gradle

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # 根据你的项目修改版本，比如 8, 11, 21
          distribution: 'temurin'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 使用 Gradle 构建 (打包 Jar)
        run: ./gradlew build -x test # -x test 表示跳过测试，若不想跳过可去掉

      - name: 上传 Jar 包作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ledger-jar
          path: build/libs/*.jar # 自动抓取打好的 Jar 包
