<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 聊天室</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --bg: #0f172a; --panel: #1e293b; --panel-2: #273449;
          --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
          --accent: #6366f1; --accent-2: #818cf8;
          --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                       "Microsoft YaHei", sans-serif;
          background: var(--bg); color: var(--text);
          height: 100vh; overflow: hidden;
        }
        .hidden { display: none !important; }

        .login-mask {
          position: fixed; inset: 0; z-index: 100;
          display: flex; align-items: center; justify-content: center;
          background: radial-gradient(circle at 50% 30%, #1e293b, #0f172a 70%);
        }
        .login-card {
          width: 360px; padding: 36px 32px; background: var(--panel);
          border: 1px solid var(--border); border-radius: 16px;
          box-shadow: 0 20px 60px rgba(0,0,0,.5); text-align: center;
        }
        .login-card h1 { font-size: 22px; margin-bottom: 6px; }
        .login-card .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 26px; }
        .login-card input {
          width: 100%; padding: 12px 14px; font-size: 15px;
          background: var(--bg); color: var(--text);
          border: 1px solid var(--border); border-radius: 10px; outline: none;
        }
        .login-card input:focus { border-color: var(--accent); }
        .login-card button {
          width: 100%; margin-top: 14px; padding: 12px;
          font-size: 15px; font-weight: 600; color: #fff;
          background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
        }
        .login-card button:hover { background: var(--accent-2); }
        .error { margin-top: 12px; font-size: 13px; color: var(--red); min-height: 18px; }

        .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

        .sidebar {
          background: var(--panel); border-right: 1px solid var(--border);
          padding: 18px 16px; display: flex; flex-direction: column; gap: 16px;
          overflow-y: auto;
        }
        .sidebar-header { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
        .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.offline { background: var(--red); }
        .sidebar h3 {
          font-size: 12px; font-weight: 600; letter-spacing: .08em;
          text-transform: uppercase; color: var(--muted);
          display: flex; align-items: center; gap: 8px;
        }
        .badge { background: var(--panel-2); padding: 1px 8px; border-radius: 99px; font-size: 11px; }
        #userList { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        #userList li {
          display: flex; align-items: center; gap: 8px;
          padding: 7px 10px; border-radius: 8px; font-size: 14px; background: var(--panel-2);
        }
        #userList li::before {
          content: ''; width: 7px; height: 7px; border-radius: 50%;
          background: var(--green); flex-shrink: 0;
        }
        #userList li.me { background: rgba(99,102,241,.18); border: 1px solid rgba(99,102,241,.4); }
        .tips {
          margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border);
          font-size: 12px; color: var(--muted); line-height: 1.9;
        }
        .tips code { background: var(--panel-2); color: var(--accent-2); padding: 1px 6px; border-radius: 4px; font-size: 11px; }

        .chat { display: flex; flex-direction: column; min-width: 0; }
        .chat-header {
          display: flex; align-items: center; justify-content: space-between;
          padding: 16px 24px; border-bottom: 1px solid var(--border);
        }
        .chat-header h2 { font-size: 16px; }
        .chat-header .me { font-size: 13px; color: var(--muted); }

        .messages {
          flex: 1; overflow-y: auto; padding: 22px 24px;
          display: flex; flex-direction: column; gap: 14px;
        }
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .msg { display: flex; flex-direction: column; max-width: 72%; }
        .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; padding: 0 4px; }
        .msg .bubble {
          padding: 9px 14px; border-radius: 12px; background: var(--panel-2);
          line-height: 1.55; word-break: break-word; white-space: pre-wrap; font-size: 14px;
        }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.mine .bubble { background: var(--accent); color: #fff; }
        .system-msg {
          align-self: center; text-align: center; font-size: 12px; color: var(--muted);
          background: rgba(148,163,184,.1); padding: 4px 14px; border-radius: 99px;
        }

        .composer {
          display: flex; gap: 10px; padding: 16px 24px;
          border-top: 1px solid var(--border); background: var(--panel);
        }
        .composer input {
          flex: 1; padding: 12px 16px; font-size: 14px;
          background: var(--bg); color: var(--text);
          border: 1px solid var(--border); border-radius: 10px; outline: none;
        }
        .composer input:focus { border-color: var(--accent); }
        .composer input:disabled { opacity: .5; cursor: not-allowed; }
        .composer button {
          padding: 0 26px; font-size: 14px; font-weight: 600; color: #fff;
          background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
        }
        .composer button:hover:not(:disabled) { background: var(--accent-2); }
        .composer button:disabled { opacity: .45; cursor: not-allowed; }

        @media (max-width: 720px) {
          .app { grid-template-columns: 1fr; }
          .sidebar { display: none; }
        }
    </style>
</head>
<body>

<div id="login" class="login-mask">
    <div class="login-card">
        <h1>💬 WebSocket 聊天室</h1>
        <p class="subtitle">Spring Boot 3.5 + Spring WebSocket</p>
        <input id="usernameInput" maxlength="16" placeholder="输入你的昵称" autocomplete="off">
        <button id="joinBtn">加入聊天室</button>
        <p id="loginError" class="error"></p>
    </div>
</div>

<div id="app" class="app hidden">
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">连接中…</span>
        </div>
        <h3>在线成员 <span class="badge" id="onlineCount">0</span></h3>
        <ul id="userList"></ul>
        <div class="tips">
            💡 可用指令<br>
            <code>/online</code> 查看在线列表<br>
            <code>/to 昵称 内容</code> 私聊
        </div>
    </aside>

    <main class="chat">
        <header class="chat-header">
            <h2>公共大厅</h2>
            <span class="me" id="meLabel"></span>
        </header>
        <div id="messages" class="messages"></div>
        <form id="sendForm" class="composer">
            <input id="messageInput" placeholder="输入消息，回车发送…" autocomplete="off" disabled>
            <button type="submit" disabled>发送</button>
        </form>
    </main>
</div>

<script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      let ws = null, username = '', manualClose = false;

      $('joinBtn').addEventListener('click', join);
      $('usernameInput').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

      function join() {
        const name = $('usernameInput').value.trim();
        if (!name) return showError('请输入昵称');
        if (!/^[\w\u4e00-\u9fa5]{1,16}$/.test(name)) return showError('昵称需为 1-16 位字母、数字、下划线或中文');
        username = name;
        $('loginError').textContent = '';
        connect();
      }
      function showError(msg) { $('loginError').textContent = msg; }

      function connect() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = `${proto}//${location.host}/ws/chat?username=${encodeURIComponent(username)}`;
        setStatus('connecting', '连接中…');
        ws = new WebSocket(url);

        ws.addEventListener('open', () => {
          setStatus('online', '已连接');
          $('login').classList.add('hidden');
          $('app').classList.remove('hidden');
          $('meLabel').textContent = `我是 ${username}`;
          $('messageInput').disabled = false;
          $('sendForm').querySelector('button').disabled = false;
          $('messageInput').focus();
        });

        ws.addEventListener('message', e => {
          let msg; try { msg = JSON.parse(e.data); } catch { return; }
          handle(msg);
        });

        ws.addEventListener('close', e => {
          setStatus('offline', '已断开');
          $('messageInput').disabled = true;
          $('sendForm').querySelector('button').disabled = true;
          if (!manualClose) addSystem(`连接已关闭${e.reason ? '：' + e.reason : ''}`);
        });

        ws.addEventListener('error', () => setStatus('offline', '连接异常'));
      }

      function handle(msg) {
        if (typeof msg.online === 'number') $('onlineCount').textContent = msg.online;
        switch (msg.type) {
          case 'chat':   addChat(msg.from, msg.text, msg.from === username); break;
          case 'system': addSystem(msg.text); break;
          case 'online': renderUsers(msg.users || []); break;
        }
      }

      $('sendForm').addEventListener('submit', e => {
        e.preventDefault();
        const input = $('messageInput');
        const text = input.value.trim();
        if (!text) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) { addSystem('连接已断开，无法发送'); return; }
        ws.send(text);
        input.value = '';
        input.focus();
      });

      function addChat(from, text, mine) {
        const wrap = document.createElement('div');
        wrap.className = 'msg' + (mine ? ' mine' : '');
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = mine ? '我' : from;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        wrap.append(meta, bubble);
        appendToMessages(wrap);
      }
      function addSystem(text) {
        const el = document.createElement('div');
        el.className = 'system-msg';
        el.textContent = text;
        appendToMessages(el);
      }
      function appendToMessages(el) {
        const box = $('messages');
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
      }
      function renderUsers(users) {
        const ul = $('userList');
        ul.innerHTML = '';
        users.forEach(name => {
          const li = document.createElement('li');
          li.textContent = name;
          if (name === username) li.classList.add('me');
          ul.appendChild(li);
        });
        $('onlineCount').textContent = users.length;
      }
      function setStatus(state, text) {
        const dot = $('statusDot');
        dot.className = 'dot' + (state === 'online' ? ' online' : state === 'offline' ? ' offline' : '');
        $('statusText').textContent = text;
      }

      window.addEventListener('beforeunload', () => {
        manualClose = true;
        if (ws && ws.readyState === WebSocket.OPEN) ws.close(1000, 'page unload');
      });
    })();
</script>
</body>
</html>
